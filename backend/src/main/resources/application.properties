# Server Port Configuration
server.port=5000

# Spring Application Name
spring.application.name=MediSphere-Backend

# Twilio Credentials Configuration
twilio.accountSid=${VITE_TWILIO_ACCOUNT_SID}
twilio.authToken=${VITE_TWILIO_AUTH_TOKEN}
twilio.phoneNumber=${VITE_TWILIO_PHONE_NUMBER:+18167506748}

# Logging Configuration
logging.level.com.medisphere=DEBUG
logging.level.org.springframework.web=INFO

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:medisphere_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
