# Server Port Configuration
server.port=${PORT:5000}

# Spring Application Name
spring.application.name=MediSphere-Backend

# Twilio Credentials Configuration
twilio.accountSid=${VITE_TWILIO_ACCOUNT_SID:${TWILIO_ACCOUNT_SID:}}
twilio.authToken=${VITE_TWILIO_AUTH_TOKEN:${TWILIO_AUTH_TOKEN:}}
twilio.phoneNumber=${VITE_TWILIO_PHONE_NUMBER:${TWILIO_PHONE_NUMBER:+18167506748}}

# Logging Configuration
logging.level.com.medisphere=DEBUG
logging.level.org.springframework.web=INFO

# Database Configuration (PostgreSQL)
# Supports direct SPRING_DATASOURCE_URL, DATABASE_URL, or individual PGHOST/PGPORT/PGDATABASE parameters
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:medisphere_db}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
